version: '3.8'

services:
  website:
    image: petergriffer/kursach_website:latest
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.swarm.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app_network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:umami123@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: my-super-secret-key-change-this-in-production
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app_network

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app_network

  umami-db-backup:
    image: tiredofit/db-backup
    volumes:
      - ./backups:/backup
    environment:
      DB_TYPE: postgres
      DB_HOST: umami-db
      DB_NAME: umami
      DB_USER: umami
      DB_PASS: umami123
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app_network

networks:
  app_network:
    driver: overlay

volumes:
  postgres_data:
    driver: local