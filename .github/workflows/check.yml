name: Check
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install npm
        run: npm install
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run test:lint
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install npm
        run: npm install
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm run test
  build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install npm
        run: npm install
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build:image
      - name: Docker Compose Up
        run: npm run docker:compose
      - name: Test with Curl
        run: npm run test:curl
  build_and_push:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kursach_website:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/kursach_website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: [build_and_push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SWARM_MANAGER_IP }}
          username: root
          key: ${{ secrets.SWARM_MANAGER_SSH }}
          script: |
            echo " SSH подключение работает!"
            git pull origin main
            cd opt/kursach
            echo " Запускаем Docker Stack..."
            docker stack deploy -c docker-compose.swarm.yml kursach --with-registry-auth
            echo " Проверяем сервисы..."
            sleep 15
            docker service ls
            echo " Деплой завершен!"
      
